<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Playing {{ game.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Additional styles for the game execution page */
        #game-container {
            width: 100%;
            height: 600px; /* Adjust as needed */
            border: 1px solid #ccc;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000; /* Default background if iframe content doesn't fill */
            color: #fff;
        }
        #game-container iframe {
            width: 100%;
            height: 100%;
            border: none; /* Ensure iframe border doesn't interfere */
        }
    </style>
</head>
<body>
    <header>
        <h1>Now Playing: {{ game.name }}</h1>
    </header>
    <main>
        <p><a href="{{ url_for('game_intro_page', game_id=game_id) }}">Back to Game Info</a></p>
        <div id="game-container">
            {% if game.gadget_url %}
                <iframe src="{{ url_for('gadget_iframe_content', url=game.gadget_url) }}" width="100%" height="100%" frameborder="0"></iframe>
            {% else %}
                <p>This game does not have a gadget URL configured.</p>
            {% endif %}
        </div>
        <!-- OpenSocial JavaScript API will be included and used here later -->
    </main>
    <footer>
        <p>&copy; 2023 Social Game Platform</p>
    </footer>
</body>
</html>
