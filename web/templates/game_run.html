<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>プレイ中: {{ .game.Name }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        #game-container {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: #fff;
        }
        #game-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>プレイ中: {{ .game.Name }}</h1>
    </header>
    <main>
        <p><a href="/game/{{ .game_id }}">ゲーム情報に戻る</a></p>
        <div id="game-container">
            {{ if .game.GadgetURL }}
                <!-- /gadgets/ifr?url= は次のステップで実装 -->
                <iframe src="/gadgets/ifr?url={{ .game.GadgetURL }}" width="100%" height="100%" frameborder="0"></iframe>
            {{ else }}
                <p>このゲームにはガジェットURLが設定されていません。</p>
            {{ end }}
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Social Game Platform</p>
    </footer>
</body>
</html>
